<div class="max-w-2xl mx-auto p-6">
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700 p-6">

    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-gray-900 dark:text-white">Nouvelle réservation</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
        Créer une nouvelle réservation de trottinette
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Trottinette -->
      <div>
        <label for="trottinette" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Trottinette <span class="text-red-500">*</span>
        </label>
        <select
          id="trottinette"
          [(ngModel)]="reservation.trottinette"
          name="trottinette"
          required
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
          <option [ngValue]="null">-- Sélectionner une trottinette --</option>
          <option *ngFor="let trottinette of trottinettes" [ngValue]="trottinette.id">
            {{ trottinette.QR_code }} - {{ trottinette.model }}
          </option>
        </select>
      </div>

      <!-- Start Time -->
      <div>
        <label for="start_time" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Date et heure de début <span class="text-red-500">*</span>
        </label>
        <input
          type="datetime-local"
          id="start_time"
          [(ngModel)]="reservation.start_time"
          name="start_time"
          required
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all" />
      </div>

      <!-- Total Cost -->
      <div>
        <label for="total_cost" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Coût total (TND)
        </label>
        <input
          type="number"
          id="total_cost"
          [(ngModel)]="reservation.total_cost"
          name="total_cost"
          step="0.01"
          min="0"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
          placeholder="0.00" />
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="!reservation.trottinette || isSubmitting"
          class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white rounded-lg transition-colors flex items-center gap-2">
          <span *ngIf="isSubmitting" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          Créer la réservation
        </button>
      </div>

    </form>

  </div>
</div>

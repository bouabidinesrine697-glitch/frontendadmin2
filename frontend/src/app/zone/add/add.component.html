<div class="max-w-4xl mx-auto p-6">
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700 p-6">

    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-gray-900 dark:text-white">Ajouter une zone</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
        Remplissez les informations de la nouvelle zone
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- nom -->
      <div>
        <label for="nom" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Nom de la zone <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="nom"
          [(ngModel)]="zone.nom"
          name="nom"
          required
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
          placeholder="Entrez le nom de la zone" />
      </div>

      <!-- Description -->
 

      <!-- Map -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Localisation
        </label>
        <p class="text-xs text-gray-500 mb-2">Cliquez sur la carte pour définir l'emplacement de la zone</p>
        <div class="h-64 border border-gray-300 dark:border-gray-600 rounded-lg overflow-hidden">
          <div leaflet [leafletOptions]="options" [leafletLayers]="layers" (leafletMapReady)="onMapReady($event)" class="h-full"></div>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          Latitude: {{ zone.latitude?.toFixed(6) }}, Longitude: {{ zone.longitude?.toFixed(6) }}
        </p>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
          Annuler
        </button>
        {{zone.nom.trim()}}
        <button
          type="submit"
          [disabled]="!zone.nom.trim() || isSubmitting"
          class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white rounded-lg transition-colors flex items-center gap-2">
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          Ajouter la zone
        </button>
      </div>

    </form>

  </div>
</div>

  <!-- Brand -->
  <!-- <div class="flex items-center gap-3 px-4 py-[18px] border-b border-neutral-200 dark:border-neutral-800">

      <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

  </div> -->

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-2 py-3 space-y-4">
    <div *ngFor="let section of sections">
      <p *ngIf="isOpen" class="px-2 mb-1 text-[10px] font-medium uppercase tracking-widest text-neutral-400">
        {{ section.title }}
      </p>
      <ul class="space-y-0.5">
        <li *ngFor="let item of section.items">
          <a [routerLink]="item.route" routerLinkActive="bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 font-medium"
            class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-[13px] text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-white transition-colors">
            <!-- icons via ng-container + [ngSwitch] -->
            <ng-container [ngSwitch]="item.icon">
              <svg *ngSwitchCase="'dashboard'" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <svg *ngSwitchCase="'scooter'"   class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M5 16V8l4-4h7l3 4v5"/><path d="M9 4v12"/></svg>
              <svg *ngSwitchCase="'users'"     class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <svg *ngSwitchCase="'calendar'"  class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <svg *ngSwitchCase="'profile'"   class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              <svg *ngSwitchCase="'team'"      class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
              <svg *ngSwitchCase="'settings'"  class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </ng-container>

            <span *ngIf="isOpen" class="flex-1 whitespace-nowrap">{{ item.label }}</span>
            <span *ngIf="isOpen && item.badge"
              [class]="'ml-auto text-[10px] font-medium px-1.5 py-0.5 rounded-full text-white ' + (item.badgeType === 'warn' ? 'bg-amber-500' : 'bg-emerald-600')">
              {{ item.badge }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- User bar -->
  <div class="flex items-center gap-2.5 px-3 py-3 border-t border-neutral-200 dark:border-neutral-800">
    <div class="w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-900 flex items-center justify-center text-[12px] font-medium text-emerald-700 dark:text-emerald-400 flex-shrink-0">
      AS
    </div>
    <div *ngIf="isOpen" class="flex-1 min-w-0">
      <p class="text-[13px] font-medium text-neutral-900 dark:text-white truncate">Admin Sys</p>
      <p class="text-[11px] text-neutral-500 truncate">Administrateur</p>
    </div>
    <button *ngIf="isOpen" class="w-7 h-7 rounded-md flex items-center justify-center text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-600 transition-colors">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</aside>
